      - name: Create README
        run: |
          cat > README.md <<'EOF'
          # Debt Payoff Planner

          Expo app for debt payoff estimates and AI-assisted loan agreement explanations.

          ## Features

          - Local debt storage.
          - Avalanche and snowball strategies.
          - Monthly interest estimates and payment rollover.
          - JSON backup export on the web.
          - AI-assisted loan agreement explanation through a separate backend.
          - Automated calculator tests.

          ## Backend deployment

          The backend is in `backend/`. Deploy it as a Render web service using
          the repository's `render.yaml` configuration.

          Set `OPENAI_API_KEY` as a secret in Render. Set `OPENAI_MODEL` to a
          model available to your OpenAI API project. Never place the API key
          in the app or commit it to GitHub.

          API usage is billed separately from a ChatGPT subscription.

          ## Tests

          Run:

          - `npx tsx --test tests/debtCalculator.test.ts`
          - `npx tsc --noEmit`
          - `npx expo export --platform web`
          - `cd backend && npm install && npm run check`

          ## Important

          Payoff figures are estimates, not guarantees. Actual lender terms,
          interest accrual, fees, payment timing, and payment-allocation rules
          can change results. The agreement analyzer is educational, not legal advice.
          EOF

      - name: Run calculator tests
        run: npx tsx --test tests/debtCalculator.test.ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Check backend syntax
        run: node --check backend/server.mjs

      - name: Build web app
        run: npx expo export --platform web

      - name: Commit generated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build debt payoff app and AI agreement analyzer"
            git push
          fi
