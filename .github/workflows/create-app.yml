      - name: Configure TypeScript test checks
        run: |
          cat > tsconfig.check.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "types": ["node", "react"],
              "noEmit": true
            },
            "include": [
              "App.tsx",
              "src/**/*.ts",
              "tests/**/*.ts"
            ],
            "exclude": ["node_modules"]
          }
          EOF

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Test debt calculator
        run: npx tsx --test tests/debtCalculator.test.ts

      - name: Check TypeScript
        run: npx tsc --noEmit -p tsconfig.check.json

      - name: Check backend syntax
        run: node --check backend/server.mjs

      - name: Build Expo web app
        run: npx expo export --platform web

      - name: Commit generated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build debt payoff app with corrected tests"
            git push
          fi
