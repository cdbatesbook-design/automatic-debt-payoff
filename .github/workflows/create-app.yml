      - name: Create README
        run: |
          cat > README.md <<'EOF'
          # Debt Payoff Planner

          Expo application for debt-payoff estimates and AI-assisted loan agreement explanations.

          ## App

          - Adds and stores debts locally on the device.
          - Estimates avalanche and snowball payoff plans.
          - Exports a JSON backup from the web app.
          - Provides an agreement text analysis interface.

          ## Backend

          The `backend` directory contains a Node.js service that calls the OpenAI Responses API.

          Deploy with the repository's `render.yaml` blueprint or configure a Render web service with:

          - Root directory: `backend`
          - Build command: `npm install`
          - Start command: `npm start`
          - Health check: `/health`
          - Environment variable: `OPENAI_API_KEY`
          - Environment variable: `OPENAI_MODEL` (use a model available to your API project)

          Never put an API key in the Expo app or commit it to GitHub.

          ## Test

          ```bash
          npx tsx --test tests/debtCalculator.test.ts
          npx tsc --noEmit
          npx expo export --platform web
          cd backend && npm install && npm run check
          ```

          ## Important

          Payoff results are estimates. Actual loan terms, interest accrual, fees, payment timing, and lender payment-allocation rules can change the result. The agreement reader is educational, not legal advice.
          EOF

      - name: Run calculator tests
        run: npx tsx --test tests/debtCalculator.test.ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Check backend syntax
        run: node --check backend/server.mjs

      - name: Build web app
        run: npx expo export --platform web

      - name: Commit generated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build debt payoff app and AI agreement analyzer"
            git push
          fi
